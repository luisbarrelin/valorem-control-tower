name: Atualizar base e publicar dashboard
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [sharepoint-report]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validar dados recebidos do SharePoint
        if: github.event_name == 'repository_dispatch'
        run: node automation/sync-report.cjs
      - name: Salvar a base validada
        if: github.event_name == 'repository_dispatch'
        run: |
          if [ -n "$(git status --porcelain -- data/report.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/report.json
            git commit -m 'Atualizar base do SharePoint'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - name: Preparar arquivos públicos
        run: |
          mkdir -p _site
          cp index.html valorem-logo.png .nojekyll _site/
          if [ -d data ]; then cp -R data _site/data; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v5
